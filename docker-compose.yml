version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Ensure arm64 images for EC2 t4g.small
      platforms:
        - linux/arm64
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      # This file is created on the EC2 host at deploy time from SSM Parameter Store
      - ./deploy/env/.backend.env
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/health', res => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
      # If you specifically want to bake a public API URL (not required if you accept the '/api' default below):
      # args:
      #   - VITE_API_URL=https://portfoliopen.org/api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped