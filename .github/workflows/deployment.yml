name: Deploy (AWS)

on:
  push:
    branches:
      - aws-deploy
  pull_request:
    branches:
      - aws-deploy

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}           # e.g., 145400477079.dkr.ecr.ap-south-1.amazonaws.com
      ECR_BACKEND_REPO: ${{ secrets.ECR_BACKEND_REPO }}   # e.g., portfoliopen-backend
      ECR_WEB_REPO: ${{ secrets.ECR_WEB_REPO }}           # e.g., portfoliopen-frontend
      IMAGE_TAG: aws-deploy-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend (linux/arm64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ env.IMAGE_TAG }} \
            -f backend/Dockerfile \
            ./backend \
            --push

      - name: Build & Push Web (linux/arm64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_WEB_REPO }}:${{ env.IMAGE_TAG }} \
            -f frontend/Dockerfile \
            ./frontend \
            --push