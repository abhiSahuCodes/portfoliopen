version: "3.9"

services:
  backend:
    image: ${ECR_REGISTRY}/${ECR_BACKEND_REPO}:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      PORT: 5000
    env_file:
      - ./deploy/env/.backend.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/health', res => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    image: ${ECR_REGISTRY}/${ECR_WEB_REPO}:${IMAGE_TAG}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped